# CodeRabbit settings for pdfpro-frontend.
# Most HTML here is generated by build.py, so docstring coverage is noise rather than signal.
reviews:
  pre_merge_checks:
    docstrings:
      mode: "off"
  # Build bookkeeping files: always change together with the pages, nothing to review.
  path_filters:
    - "!.build-manifest.json"
    - "!sitemap.xml"
